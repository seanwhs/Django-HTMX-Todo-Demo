<!-- todo/templates/todo/partials/footer_actions.html -->
<div id="footer-actions" hx-swap-oob="true" class="flex items-center space-x-4">
    {% if filter_type == 'deleted' %}
        <button hx-post="{% url 'empty_trash' %}" hx-target="#todos" hx-confirm="..." class="...">
            Empty Trash
        </button>
    {% else %}
        <button hx-post="{% url 'clear_completed' %}" hx-target="#todos" hx-swap="innerHTML" class="...">
            Clear Completed
        </button>
    {% endif %}
</div>
