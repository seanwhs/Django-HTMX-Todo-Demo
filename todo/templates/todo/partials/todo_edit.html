<!-- todo/templates/todo/partials/todo_edit.html -->
<article class="flex items-center justify-between bg-cyan-50 border-y border-cyan-100" id="todo-{{ todo.id }}">
    <form hx-post="{% url 'update_todo' todo.id %}" 
          hx-target="#todo-{{ todo.id }}" 
          hx-swap="outerHTML" 
          class="flex-1 flex items-center">
        {% csrf_token %}
        <input type="text" name="title" value="{{ todo.title }}" autofocus
               class="w-full px-6 py-4 text-sm bg-transparent border-none focus:ring-0 outline-none"
               onfocus="this.select()"
               hx-on::after-request="if(event.detail.successful) this.blur()">
        
        <div class="flex space-x-2 px-6">
            <button type="submit" class="text-green-600 font-bold text-xs uppercase">Save</button>
            <button hx-get="{% url 'todos' %}" hx-target="#todos" class="text-gray-400 text-xs uppercase">Cancel</button>
        </div>
    </form>
</article>
