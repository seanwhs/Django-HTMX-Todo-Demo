<!-- todo/templates/todo/partials/todo.html -->

{% if update_count %}
    {% include "todo/partials/counter.html" %}
{% endif %}

<article class="flex items-center justify-between bg-white hover:bg-gray-50 transition-all group" id="todo-{{ todo.id }}">
    
    <div class="flex-1 py-4 cursor-pointer" 
         hx-put="{% url 'update_todo' todo.id %}" 
         hx-target="#todo-{{ todo.id }}" 
         hx-swap="outerHTML">
        <p class="px-6 text-sm transition-all {% if todo.is_done %} line-through text-gray-300 {% else %} text-gray-700 {% endif %}">
            {{ todo.title }}
        </p>
    </div>

    <div class="px-6 py-4 flex items-center space-x-3">
        
        <button hx-get="{% url 'edit_todo' todo.id %}" 
                hx-target="#todo-{{ todo.id }}" 
                hx-swap="outerHTML"
                title="Edit task"
                class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-cyan-500 transition-all p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
        </button>

        <button hx-delete="{% url 'delete_todo' todo.id %}" 
                hx-confirm="Delete this task?" 
                hx-target="#todo-{{ todo.id }}" 
                hx-swap="outerHTML swap:300ms"
                title="Delete task"
                class="text-gray-300 hover:text-red-500 transition-colors p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>
</article>
