<!-- todo/templates/todo/partials/todo.html -->

{% if update_count %}
    {% include "todo/partials/counter.html" %}
{% endif %}

<article class="flex items-center justify-between bg-white hover:bg-gray-50 transition-all duration-300" id="todo-{{ todo.id }}">
    <div class="flex-1 py-4 cursor-pointer" hx-put="{% url 'update_todo' todo.id %}" hx-target="#todo-{{ todo.id }}" hx-swap="outerHTML">
        <p class="px-6 text-sm transition-all {% if todo.is_done %} line-through text-gray-300 {% else %} text-gray-700 {% endif %}">
            {{ todo.title }}
        </p>
    </div>

    <div class="px-6 py-4">
        <button hx-delete="{% url 'delete_todo' todo.id %}" hx-confirm="Delete this task?" hx-target="#todo-{{ todo.id }}" hx-swap="outerHTML swap:300ms"
                class="text-gray-300 hover:text-red-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>
</article>
