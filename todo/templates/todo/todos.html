<!-- todo/templates/todo/todos.html (FIXED - Django template safe) -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Todo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-swapping {
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }

        @keyframes toastFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toastFadeOut {

            0%,
            85% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>
</head>

<body class="min-h-screen bg-gray-100 font-sans">
    <main class="max-w-4xl mx-auto my-6 px-4">
        <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">

            <div class="p-6 border-b border-gray-100">
                <form hx-post="{% url 'add_todo' %}" hx-target="#todos" hx-swap="afterbegin"
                    hx-on::after-request="if(event.detail.successful) this.reset()" class="flex flex-col gap-2">
                    {% csrf_token %}
                    <div class="flex gap-4">
                        <input type="text" name="title" placeholder="What needs to be done?"
                            class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none">
                        <button type="submit"
                            class="px-6 py-3 bg-cyan-600 text-white font-bold rounded-lg hover:bg-cyan-700 transition-all">Add</button>
                    </div>
                    <div id="todo-error" class="text-red-500 text-xs font-bold px-1 hidden"></div>
                </form>
            </div>

            <div class="px-6 py-2 bg-white border-b border-gray-100">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>

                    <input type="text" id="search-input" name="q" placeholder="Search tasks..."
                        hx-get="{% url 'todos' %}" hx-trigger="keyup changed delay:500ms" hx-target="#todos"
                        hx-indicator=".search-indicator"
                        class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none text-sm">

                    <span class="search-indicator htmx-indicator absolute inset-y-0 right-0 pr-3 flex items-center">
                        <div class="animate-spin h-4 w-4 border-2 border-cyan-500 border-t-transparent rounded-full">
                        </div>
                    </span>
                </div>
            </div>

            <div class="px-6 py-3 bg-gray-50/50 border-b border-gray-100 flex justify-between items-center">
                <button hx-post="{% url 'toggle_all' %}" hx-target="#todos" hx-swap="innerHTML"
                    class="group text-gray-400 hover:text-cyan-600 flex items-center text-xs font-bold transition-colors uppercase tracking-wider">
                    <span class="mr-2 opacity-50 group-hover:opacity-100">✔️</span>
                    Mark all as done
                </button>

                <div class="flex space-x-1">
                    <button hx-get="{% url 'todos' %}" hx-target="#todos" class="...">ALL</button>
                    <button hx-get="{% url 'filter_todos' 'active' %}" hx-target="#todos" class="...">ACTIVE</button>
                    <button hx-get="{% url 'filter_todos' 'completed' %}" hx-target="#todos"
                        class="...">COMPLETED</button>
                    <button hx-get="{% url 'filter_todos' 'deleted' %}" hx-target="#todos"
                        class="px-3 py-1 text-[10px] font-bold rounded-md {% if filter_type == 'deleted' %}bg-red-600 text-white{% else %}text-gray-400 hover:bg-gray-200{% endif %}">
                        TRASH
                    </button>
                </div>

            </div>


            <div id="todos" class="divide-y divide-gray-100">
                {% include "todo/partials/list.html" %}
            </div>

            <footer class="px-6 py-4 bg-gray-50 flex justify-between items-center border-t border-gray-100">
                {% include "todo/partials/counter.html" %}
                <button hx-post="{% url 'clear_completed' %}" hx-target="#todos" hx-swap="innerHTML"
                    hx-include="[name='q']"
                    class="text-xs font-bold text-gray-400 hover:text-red-500 uppercase tracking-widest transition-colors">
                    Clear Completed
                </button>
            </footer>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col-reverse gap-2 z-50 pointer-events-none"
        style="min-width: 320px;"></div>

    <script>
        document.body.addEventListener('htmx:configRequest', (e) => {
            e.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>

</html>
