<!-- todo/templates/todo/todos.html (FIXED - Django template safe) -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Todo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-swapping {
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }

        @keyframes toastFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toastFadeOut {

            0%,
            85% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>
</head>

<body class="min-h-screen bg-gray-100 font-sans">
    <main class="max-w-4xl mx-auto my-12 px-4">
        <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
            <div class="p-6 border-b border-gray-100">
                <form hx-post="{% url 'add_todo' %}" hx-target="#todos" hx-swap="afterbegin"
                    hx-on::after-request="this.reset()" class="flex gap-4">
                    {% csrf_token %}
                    <input type="text" name="title" placeholder="What needs to be done?" required
                        class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none">
                    <button type="submit"
                        class="px-6 py-3 bg-cyan-600 text-white font-bold rounded-lg hover:bg-cyan-700 transition-all">Add</button>
                </form>
            </div>

            <div class="px-6 py-3 bg-gray-50/50 border-b border-gray-100 flex justify-between items-center">
                <button hx-post="{% url 'toggle_all' %}" hx-target="#todos" hx-swap="innerHTML"
                    class="group text-gray-400 hover:text-cyan-600 flex items-center text-xs font-bold transition-colors uppercase tracking-wider">
                    <span class="mr-2 opacity-50 group-hover:opacity-100">✔️</span>
                    Mark all as done
                </button>

                <div class="flex space-x-1">
                    <button hx-get="{% url 'todos' %}" hx-target="#todos"
                        class="px-3 py-1 text-[10px] font-bold rounded-md {% if not filter_type or filter_type == 'all' %}bg-cyan-600 text-white{% else %}text-gray-400 hover:bg-gray-200{% endif %}">ALL</button>
                    <button hx-get="{% url 'filter_todos' 'active' %}" hx-target="#todos"
                        class="px-3 py-1 text-[10px] font-bold rounded-md {% if filter_type == 'active' %}bg-cyan-600 text-white{% else %}text-gray-400 hover:bg-gray-200{% endif %}">ACTIVE</button>
                    <button hx-get="{% url 'filter_todos' 'completed' %}" hx-target="#todos"
                        class="px-3 py-1 text-[10px] font-bold rounded-md {% if filter_type == 'completed' %}bg-cyan-600 text-white{% else %}text-gray-400 hover:bg-gray-200{% endif %}">COMPLETED</button>
                </div>
            </div>

            <div id="todos" class="divide-y divide-gray-100">
                {% include "todo/partials/list.html" %}
            </div>

            <footer class="px-6 py-4 bg-gray-50 flex justify-between items-center border-t border-gray-100">
                {% include "todo/partials/counter.html" %}
                <button hx-post="{% url 'clear_completed' %}" hx-target="#todos" hx-swap="innerHTML"
                    class="text-xs font-bold text-gray-400 hover:text-red-500 uppercase tracking-widest transition-colors">
                    Clear Completed
                </button>
            </footer>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col-reverse gap-2 z-50 pointer-events-none"
        style="min-width: 320px;"></div>

    <script>
        document.body.addEventListener('htmx:configRequest', (e) => {
            e.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>

</html>
